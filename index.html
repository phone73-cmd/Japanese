<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7fbff"><title>여행 일본어 3분</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/app.css"><link rel="apple-touch-icon" href="assets/icon.svg"></head><body><div class="app">
<header class="top"><div class="brand">🇯🇵 여행 일본어 3분</div><input id="search" class="search" placeholder="한국어·일본어로 검색해보세요"><button class="iconbtn" onclick="toggleMode()">🌙/☀️</button></header>
<div class="layout"><aside class="side"><div class="panel"><button class="navbtn active" data-v="home" onclick="nav('home')">🏠 홈</button><button class="navbtn" data-v="vocab" onclick="nav('vocab')">📘 단어장</button><button class="navbtn" data-v="saved" onclick="nav('saved')">❤️ 저장 표현</button><button class="navbtn" data-v="quiz" onclick="nav('quiz')">🧠 퀴즈</button></div><div class="panel" style="margin-top:14px"><b>테마 색상</b><div class="themeRow" style="margin-top:12px"><button class="swatch blue" onclick="setTheme('blue')"></button><button class="swatch pink" onclick="setTheme('pink')"></button><button class="swatch green" onclick="setTheme('green')"></button><button class="swatch lavender" onclick="setTheme('lavender')"></button></div></div></aside>
<main class="main">
<section id="home" class="view"><div class="hero"><h1>오늘도 여행 일본어 3분 ✨</h1><p>상황을 고르고, 듣고, 저장하고, 단어까지 함께 익혀보세요.</p></div><div id="cats" class="grid"></div></section>
<section id="phrases" class="view hidden"><div class="sectionTitle"><h2 id="phraseTitle">표현</h2><button class="btn" onclick="nav('home')">← 카테고리</button></div><div id="phraseList"></div></section>
<section id="vocab" class="view hidden"><div class="sectionTitle"><h2>📘 여행 단어장</h2><span>예문과 함께 학습</span></div><div id="vocabList" class="wordgrid"></div></section>
<section id="saved" class="view hidden"><div class="sectionTitle"><h2>❤️ 나의 저장 표현</h2></div><div id="savedList"></div></section>
<section id="quiz" class="view hidden"><div class="sectionTitle"><h2>🧠 10문제 퀴즈</h2></div><div id="quizBox"></div></section>
</main>
<aside class="right"><div class="panel"><h3>📊 학습 현황</h3><div class="stat"><div><b id="phraseN">0</b><small>전체 문장</small></div><div><b id="wordN">0</b><small>단어</small></div><div><b id="saveN">0</b><small>저장 표현</small></div><div><b id="learnN">0</b><small>암기 단어</small></div></div></div><div class="panel" style="margin-top:14px"><h3>💡 사용 팁</h3><p class="ko">PC에서는 3단 화면, 태블릿은 2단, 휴대폰에서는 한 손 조작용 화면으로 자동 변경됩니다.</p><p class="ko">🔊 버튼으로 일본어 발음을 바로 들을 수 있습니다.</p></div></aside></div>
<nav class="bottom"><button onclick="nav('home')"><span>🏠</span>홈</button><button onclick="nav('vocab')"><span>📘</span>단어장</button><button onclick="nav('saved')"><span>❤️</span>저장</button><button onclick="nav('quiz')"><span>🧠</span>퀴즈</button><button onclick="toggleMode()"><span>🌙</span>테마</button></nav>
</div><script src="assets/data.js"></script><script src="assets/app.js"></script></body></html>
